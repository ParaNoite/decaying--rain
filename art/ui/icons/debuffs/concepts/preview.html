<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Debuff Icon Concepts</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px; background: #171717; color: #f2f2f2; font-family: "Microsoft YaHei", sans-serif; }
    h1 { margin: 0 0 8px; font-size: 28px; font-weight: 700; }
    p { margin: 0 0 28px; color: #b8b8b8; font-size: 15px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; max-width: 1160px; }
    .group { border-top: 2px solid #ff0000; padding-top: 10px; }
    .group-name { margin: 0 0 10px; color: #ff4d4d; font-size: 18px; font-weight: 700; }
    .options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .option { min-height: 166px; padding: 10px; background: #252525; text-align: center; }
    img { width: 112px; height: 112px; display: block; margin: 0 auto 9px; }
    .label { color: #dddddd; font-size: 13px; line-height: 1.3; }
  </style>
</head>
<body>
  <h1>Debuff 图标意象候选</h1>
  <p>图标本体均为透明背景、仅使用纯红 #ff0000。每行比较的是不同意象，不是不同画风。</p>
  <main class="grid">
    <section class="group">
      <h2 class="group-name">流血</h2>
      <div class="options">
        <div class="option"><img src="../bleeding.svg"><div class="label">正式版：裂纹血滴</div></div>
      </div>
    </section>
    <section class="group">
      <h2 class="group-name">骨折</h2>
      <div class="options">
        <div class="option"><img src="../fracture.svg"><div class="label">正式版：肢段断裂</div></div>
      </div>
    </section>
    <section class="group">
      <h2 class="group-name">断腿</h2>
      <div class="options">
        <div class="option"><img src="../broken-leg.svg"><div class="label">正式版：标准侧视</div></div>
      </div>
    </section>
    <section class="group">
      <h2 class="group-name">饥肠辘辘</h2>
      <div class="options">
        <div class="option"><img src="../hungry.svg"><div class="label">正式版：细收腰刀刃</div></div>
      </div>
    </section>
    <section class="group">
      <h2 class="group-name">劳累</h2>
      <div class="options">
        <div class="option"><img src="../exhausted.svg"><div class="label">正式版：弯腰力竭</div></div>
      </div>
    </section>
    <section class="group">
      <h2 class="group-name">雨淋</h2>
      <div class="options">
        <div class="option"><img src="../rain-exposure.svg"><div class="label">正式版：雨中人物</div></div>
      </div>
    </section>
  </main>
</body>
</html>
